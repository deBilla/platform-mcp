name: Release

# Publishes to PyPI when a version tag is pushed. Authentication uses PyPI
# Trusted Publishing (OIDC), so there is no API token stored anywhere -- set
# the publisher up once at https://pypi.org/manage/account/publishing/ for
# this repository, workflow file, and the "pypi" environment below.
on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify the tag matches the packaged version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(python -c 'import tomllib;print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
          if [ "$tag" != "$version" ]; then
            echo "::error::tag $tag does not match pyproject version $version"
            exit 1
          fi

      - name: Build
        run: |
          pip install build twine
          python -m build
          twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # required for Trusted Publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1

  registry:
    # Runs after PyPI, because the registry only stores a pointer -- it
    # resolves the package on PyPI and would 404 on a version not yet there.
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # GitHub OIDC, so there is no registry token to store
    steps:
      - uses: actions/checkout@v4

      - name: Verify server.json matches the release
        run: |
          tag="${GITHUB_REF_NAME#v}"
          python - "$tag" <<'PY'
          import json, sys
          tag = sys.argv[1]
          d = json.load(open("server.json"))
          versions = {d["version"]} | {p["version"] for p in d.get("packages", [])}
          if versions != {tag}:
              sys.exit(f"server.json has {sorted(versions)}, expected {tag}")
          print(f"server.json is at {tag}")
          PY

      - name: Install mcp-publisher
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/download/v${PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz" \
            | tar xz mcp-publisher
          ./mcp-publisher --version
        env:
          PUBLISHER_VERSION: 1.8.1

      - name: Publish to the MCP registry
        run: |
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
